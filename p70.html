<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h3 id="heading">THis is a HEADING.</h3>
    <input
      type="button"
      value="HIDE"
      onclick="document.getElementById('heading').style.visibility = 'hidden'"
    />
    <input
      type="button"
      value="SHOW"
      onclick="document.getElementById('heading').style.visibility = 'visible'"
    />
  </body>
</html>
