<!DOCTYPE html>

<body>
    <script>
        function setName(obj){ // obj = person
            obj.name = "Hye";
            obj = new Object(); //new keyword 사용시 새로운 객체를 만든다고 생각하기
            obj.name = "Greg"; // new keyword 사용시 heap에 새로운 것을 할당
        }
        var person = new Object();
        setName(person);
        alert(person.name);
    </script>
